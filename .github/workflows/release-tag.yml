# =============================================================================
#  tree-sitter-snowflake · GitHub Actions
# -----------------------------------------------------------------------------
#  File                release-tag.yml
#  Workflow name       Release tag
#  Type                Entrypoint (runs in this repo only)
#  Triggers            pull_request (closed, base main)
#  Purpose             Tags the version once release-plz.yml's release PR
#                      (head branch release-plz/release) is merged into main,
#                      and tags the companion snowflake-handlers crate at its
#                      own version with release-plz.toml's tag template and
#                      publishes that tag's GitHub release.
#                      A tag ref isn't covered by this repo's branch
#                      rulesets, so pushing it needs no PR — but GitHub never
#                      fires further workflow runs off a GITHUB_TOKEN-
#                      authored push, so the tag push alone would never reach
#                      release.yml's crates.io + npm publish sequence. This
#                      workflow explicitly dispatches release.yml with the
#                      tag it just pushed instead of relying on that event.
# =============================================================================

name: Release tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release-plz/release' && github.event.pull_request.user.login == 'github-actions[bot]'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the merged release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Tag the release and dispatch the publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          tag="v${version}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            test "$(git rev-parse "refs/tags/${tag}^{commit}")" = "$(git rev-parse HEAD)"
            echo "Tag ${tag} already exists at this release commit — retrying publish dispatch."
          else
            git tag -a "${tag}" -m "${tag}"
            git push origin "${tag}"
          fi
          gh workflow run release.yml --ref "$tag" -f "tag=${tag}"
      # The companion crate versions independently of the root package, so
      # release-plz.toml names a tag template of its own for it. release-plz
      # only ever runs `update` in this repository, never `release`, and no
      # other step creates that tag — release-plz's changelog entries link to
      # it and its per-package release state reads from it. This step does.
      # It runs after the dispatch on purpose: a rejected companion tag push
      # must not keep the crates.io and npm publish from starting. The name
      # does not start with `v` either, so it matches no `v*` tag filter.
      - name: Tag the companion crate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="snowflake-handlers/Cargo.toml"
          if [ ! -f "$manifest" ]; then
            echo "No snowflake-handlers package in this commit — skipping its tag."
            exit 0
          fi
          handlers_version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest")
          if [ -z "${handlers_version}" ]; then
            echo "Could not read a version from ${manifest}" >&2
            exit 1
          fi
          handlers_tag="snowflake-handlers-v${handlers_version}"
          if git show-ref --verify --quiet "refs/tags/${handlers_tag}"; then
            echo "Tag ${handlers_tag} already exists."
          else
            git tag -a "${handlers_tag}" -m "${handlers_tag}"
            git push origin "${handlers_tag}"
            echo "Tagged ${handlers_tag}."
          fi
          # The changelog entries release-plz writes link to a GitHub Release,
          # not a bare tag, so publish one or that link 404s. --latest=false
          # keeps the grammar's own release carrying the "Latest" badge.
          if gh release view "${handlers_tag}" >/dev/null 2>&1; then
            echo "Release ${handlers_tag} already exists."
          else
            gh release create "${handlers_tag}" --verify-tag --latest=false \
              -n "snowflake-handlers ${handlers_version} — published to crates.io from this commit."
            echo "Created release ${handlers_tag}."
          fi
