[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77"]

[project]
name = "tree-sitter-snowflake"
version = "1.0.0"
description = "Tree-sitter grammar for Snowflake SQL"
readme = "README.md"
license = "MIT"
authors = [{ name = "M. Reifschneider" }]
requires-python = ">=3.10"
keywords = ["incremental", "parsing", "tree-sitter", "snowflake", "sql"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/alfpricot/tree-sitter-snowflake"

[project.optional-dependencies]
core = ["tree-sitter~=0.25"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
test-requires = ["pytest", "tree-sitter~=0.25"]
test-command = "pytest {project}/bindings/python/tests"
